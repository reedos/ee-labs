# Test, build, and publish all three labs to GitHub Pages.
#
# The published site is public — that is how Pages works short of an Enterprise
# plan, and it matches the point of the suite: the labs are meant to be handed
# to people. Only the built site leaves the repo; source and history need not.
#
# STATUS: Pages is not yet available here. On the free plan a PRIVATE repo
# cannot have a Pages site (API answered 422, "Your current plan does not
# support GitHub Pages for this repository"). Two ways to unblock, both Reed's
# call, neither taken automatically:
#   - make the repo public   (Settings -> General -> Danger Zone), or
#   - upgrade to GitHub Pro  (keeps the repo private; the site is public).
# Until then the deploy step fails softly (continue-on-error) while the test
# and build stages still run as CI on every push. The moment Pages exists,
# the next push publishes to https://reedos.github.io/ee-labs/ with no other
# change.
#
# Tests gate the deploy. A lab whose explanations have stopped agreeing with
# its own measurements is worse than one that is briefly down.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      - run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r apps/signal-lab/dist  _site/signal-lab
          cp -r apps/circuit-lab/dist _site/circuit-lab
          cp -r apps/control-lab/dist _site/control-lab

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Softly, until Pages is available for this repo — see the header comment.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
