# Test, build, and publish all three labs to GitHub Pages.
#
# The published site is public — that is how Pages works short of an Enterprise
# plan, and it matches the point of the suite: the labs are meant to be handed
# to people. Only the built site leaves the repo; source and history need not.
#
# Live at https://reedos.github.io/ee-labs/ since 2026-08-31, when the repo
# went public.
#
# Tests gate the deploy. A lab whose explanations have stopped agreeing with
# its own measurements is worse than one that is briefly down.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      - run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html site/icon-512.png site/icon-180.png _site/
          cp -r apps/signal-lab/dist  _site/signal-lab
          cp -r apps/circuit-lab/dist _site/circuit-lab
          cp -r apps/control-lab/dist _site/control-lab
          # Dark-launched: built and served at its URL, linked from nowhere until
          # apps/circuit-elements-lab/RELEASE_STATUS says `released`.
          cp -r apps/circuit-elements-lab/dist _site/circuit-elements-lab
          # Same arrangement for the Power Lab: apps/power-lab/RELEASE_STATUS.
          cp -r apps/power-lab/dist _site/power-lab
          # Dark-launched labs of the EE Labs program, each gated by its own RELEASE_STATUS.
          cp -r apps/machines-lab/dist _site/machines-lab
          cp -r apps/random-lab/dist _site/random-lab
          cp -r apps/energy-lab/dist _site/energy-lab
          cp -r apps/electronics-lab/dist _site/electronics-lab
          cp -r apps/logic-lab/dist _site/logic-lab
          cp -r apps/comms-lab/dist _site/comms-lab
          cp -r apps/info-lab/dist _site/info-lab
          cp -r apps/devices-lab/dist _site/devices-lab
          cp -r apps/grid-lab/dist _site/grid-lab

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
