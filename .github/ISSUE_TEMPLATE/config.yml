# Blank issues stay ENABLED, and this is load-bearing rather than a default
# left alone: the in-app "Something wrong or unclear?" link opens
# /issues/new?title=…&body=… with the reader's whole setup already filled in.
# Turning blank issues off removes that form, and every report arriving from
# inside a lab — the ones worth having, because they carry a reproducer —
# would be dropped at the door.
blank_issues_enabled: true

contact_links:
  - name: Reporting something you saw inside a lab
    url: https://reedos.github.io/ee-labs/
    about: >
      Use the "Something wrong or unclear?" link in the lab's sidebar instead of
      a template. It brings your exact setup with it, so the thing you are
      describing can be opened and looked at rather than guessed at.
